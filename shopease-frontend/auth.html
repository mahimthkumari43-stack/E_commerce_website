<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEase - Login / Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top-nav">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">🛍️ ShopEase</a>
    </div>
  </header>

  <main class="container" style="margin-top: 40px;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 850px; margin: 0 auto;">
      
      <!-- Login Panel -->
      <div class="panel">
        <h3>Login</h3>
        <form style="margin-top: 20px;" action="dashboard.html">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control" value="mahi@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" value="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
      </div>

      <!-- Register Panel -->
      <div class="panel">
        <h3>Create Account</h3>
        <form style="margin-top: 20px;" action="dashboard.html">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" placeholder="Mahi Kumari" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control" placeholder="mahi@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
        </form>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
