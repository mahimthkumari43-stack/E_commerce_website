<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEase - Shopping Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top-nav">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">🛍️ ShopEase</a>
    </div>
  </header>

  <main class="container" style="margin-top: 30px;">
    <h2>Shopping Cart</h2>

    <div class="checkout-layout">
      <!-- Item Table -->
      <div class="panel">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border-color); text-align: left;">
              <th style="padding-bottom: 12px;">Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cartTableBody">
            <!-- Dynamically populated by JS -->
          </tbody>
        </table>
        <a href="listing.html" style="display: inline-block; margin-top: 20px; color: var(--primary); font-weight: 600;">← Continue Shopping</a>
      </div>

      <!-- Order Summary -->
      <div class="panel" style="height: fit-content;">
        <h3>Order Summary</h3>
        <div style="display: flex; justify-content: space-between; margin: 15px 0;">
          <span>Subtotal</span>
          <strong id="subtotalVal">$0.00</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 15px 0;">
          <span>Shipping</span>
          <strong>$10.00</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 15px 0; color: var(--success);">
          <span>Discount</span>
          <strong>-$30.00</strong>
        </div>
        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 15px 0;">
        <div style="display: flex; justify-content: space-between; margin: 15px 0; font-size: 18px;">
          <strong>Total</strong>
          <strong id="totalVal" style="color: var(--primary);">$0.00</strong>
        </div>

        <a href="checkout.html" class="btn btn-primary btn-full">Proceed to Checkout</a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    function renderCart() {
      const cart = ShopApp.getCart();
      const tbody = document.getElementById('cartTableBody');
      tbody.innerHTML = '';

      let subtotal = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        tbody.innerHTML += `
          <tr style="border-bottom: 1px solid var(--border-color);">
            <td style="padding: 15px 0; display: flex; align-items: center; gap: 12px;">
              <img src="${item.image}" style="width: 50px; height: 50px; object-fit: contain; border-radius: 6px;">
              <div>
                <strong>${item.name}</strong><br>
                <small style="color: var(--text-muted);">${item.variant || ''}</small>
              </div>
            </td>
            <td>${ShopApp.formatCurrency(item.price)}</td>
            <td>
              <button onclick="changeQty(${index}, -1)" style="padding: 2px 8px;">-</button>
              <span style="margin: 0 8px;">${item.quantity}</span>
              <button onclick="changeQty(${index}, 1)" style="padding: 2px 8px;">+</button>
            </td>
            <td>${ShopApp.formatCurrency(itemTotal)}</td>
            <td><button onclick="removeItem(${index})" style="background: none; border: none; cursor: pointer; color: #ef4444;">✕</button></td>
          </tr>
        `;
      });

      document.getElementById('subtotalVal').textContent = ShopApp.formatCurrency(subtotal);
      document.getElementById('totalVal').textContent = ShopApp.formatCurrency(Math.max(0, subtotal + 10 - 30));
    }

    function changeQty(index, change) {
      let cart = ShopApp.getCart();
      cart[index].quantity += change;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      ShopApp.saveCart(cart);
      renderCart();
    }

    function removeItem(index) {
      let cart = ShopApp.getCart();
      cart.splice(index, 1);
      ShopApp.saveCart(cart);
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
