<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEase - Checkout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top-nav">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">🛍️ ShopEase</a>
    </div>
  </header>

  <main class="container" style="margin-top: 30px;">
    <div class="checkout-layout">
      <!-- Shipping Form -->
      <div class="panel">
        <h3>Shipping Address</h3>
        <form style="margin-top: 20px;" action="success.html">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" value="Mahi Kumari" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" class="form-control" value="+91 9870543210" required>
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" class="form-control" value="123, Raj Nagar Ext." required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>City</label>
              <input type="text" class="form-control" value="Ghaziabad">
            </div>
            <div class="form-group">
              <label>PIN Code</label>
              <input type="text" class="form-control" value="201017">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full" style="margin-top: 15px;">Continue to Payment</button>
        </form>
      </div>

      <!-- Compact Order Summary -->
      <div class="panel">
        <h3>Order Summary</h3>
        <div style="margin: 20px 0; font-size: 14px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>Nike Air Max 270 (x1)</span>
            <strong>$129.99</strong>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>Fossil Watch (x1)</span>
            <strong>$159.99</strong>
          </div>
        </div>
        <hr style="border: none; border-top: 1px solid var(--border-color);">
        <div style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 18px;">
          <strong>Total</strong>
          <strong style="color: var(--primary);">$319.97</strong>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
