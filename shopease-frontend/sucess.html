<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEase - Order Success</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top-nav">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">🛍️ ShopEase</a>
    </div>
  </header>

  <main class="container" style="text-align: center; padding: 60px 0;">
    <div class="panel" style="max-width: 500px; margin: 0 auto;">
      <div style="width: 60px; height: 60px; background: #d1fae5; color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 20px;">✓</div>
      <h2>Thank You for Your Order! 🎉</h2>
      <p style="color: var(--text-muted); margin: 10px 0 20px;">Your order has been placed successfully.</p>
      
      <div style="background: var(--bg-light); padding: 12px; border-radius: 6px; font-weight: 600; margin-bottom: 25px;">
        Order ID: #SE123456789
      </div>

      <div style="display: flex; gap: 10px;">
        <a href="index.html" class="btn btn-outline" style="flex: 1;">Continue Shopping</a>
        <a href="dashboard.html" class="btn btn-primary" style="flex: 1;">View Orders</a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
